[package]
name = "homeworkbook-bb-import-host"
version = "1.0.0"
edition = "2021"

[dependencies]
serde_json = "1"
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
