name: Validate optional cloud and web client

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --global pnpm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm repository:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm cloud:check
      - run: pnpm cloud:test
