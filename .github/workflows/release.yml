name: Release native desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-desktop.yml
    with:
      ref: ${{ inputs.release_tag || github.ref_name }}
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Require all platform assets and generate shared SHA-256 manifest
        run: node scripts/prepare-release-assets.mjs --checksums
      - name: Publish one complete release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
